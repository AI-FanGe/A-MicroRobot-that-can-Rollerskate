[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "mjlab-xiaoxiaobai"
version = "0.1.0"
description = "Xiaoxiaobai RL environment for mjlab"
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
  "mjlab==1.3.0",
  "warp-lang==1.12.0",
  "placo>=0.9.20",
  "better-actuator-models",
]

[project.entry-points."mjlab.tasks"]
mjlab_xiaoxiaobai = "mjlab_xiaoxiaobai.tasks"

[tool.ruff]
src = ["src"]  # Helpful for recognizing first-party imports.
indent-width = 4
exclude = [
  "src/mjlab/third_party",
  "typings",
]

[tool.uv.sources]
better-actuator-models = { git = "https://github.com/rhoban/bam.git", branch = "doc" }

