<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>小小白 控制台</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/app.css" />
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
  </script>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("xiaoxiaobai.theme") || "dark";
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar">
      <a class="brand" href="#/home">
        <img src="img/logo.svg" alt="" width="28" height="28" />
        <span class="brand-text"><b id="brandName">小小白</b><small>机器人控制台</small></span>
      </a>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebarFoot"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <img class="topbar-logo" src="img/logo.svg" alt="" width="26" height="26" />
        <h1 class="page-title" id="pageTitle"></h1>
        <div class="status-strip" id="statusStrip"></div>
        <button class="estop" id="estopBtn" title="急停：停止控制循环并断开所有电机力矩（Esc 两次）">
          <span class="estop-dot"></span>急停
        </button>
      </header>
      <div class="banner" id="banner" hidden></div>
      <section class="page" id="page"></section>
    </main>
  </div>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
