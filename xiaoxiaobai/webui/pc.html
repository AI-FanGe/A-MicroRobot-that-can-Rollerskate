<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>把这台电脑连到小小白</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light dark; --bg: #f4f6fa; --card: #fff; --text: #1b1f27; --muted: #667085; --line: #dde2ea; --accent: #3b82f6; --ok: #16a34a; --warn: #d97706; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0d12; --card: #151922; --text: #e6e9ef; --muted: #8b93a3; --line: #262c38; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { font-size: 22px; margin: 0 0 4px; display: flex; align-items: center; gap: 10px; }
    .sub { color: var(--muted); margin: 0 0 24px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
    .step { display: flex; gap: 14px; }
    .num { flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 14px; }
    .step > div { flex: 1; min-width: 0; }
    .step b { display: block; margin-bottom: 4px; }
    .tabs { display: flex; gap: 6px; margin: 4px 0 10px; }
    .tabs button { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 4px 12px; cursor: pointer; font: inherit; }
    .tabs button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
    .cmd { display: flex; gap: 8px; margin: 8px 0; }
    .cmd code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; padding: 10px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    .cmd button, .big { border: 0; border-radius: 8px; background: var(--accent); color: #fff; padding: 0 18px; font: inherit; font-weight: 600; cursor: pointer; }
    .muted { color: var(--muted); font-size: 13px; }
    label.check { display: flex; gap: 8px; align-items: flex-start; margin-top: 10px; font-size: 14px; cursor: pointer; }
    label.check input { margin-top: 4px; }
    kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; font: 12px ui-monospace, monospace; }
    #status { display: flex; gap: 10px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; animation: pulse 1.4s infinite; }
    .dot.ok { background: var(--ok); animation: none; }
    @keyframes pulse { 50% { opacity: .35; } }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1><img src="img/logo.svg" alt="" width="28" height="28" />把这台电脑连到小小白</h1>
  <p class="sub">连好以后，在手机 App 里或对小小白说“让电脑帮我……”，这台电脑上的 WorkBuddy 就会去做。只需要做一次，以后开机自动连。</p>

  <div class="card step">
    <span class="num">1</span>
    <div>
      <b>这台电脑上装好并登录 WorkBuddy</b>
      <span class="muted">还没装的话去 <a href="https://www.workbuddy.cn" target="_blank" rel="noopener">workbuddy.cn</a> 下载，登录一次即可。已经在用就跳过。</span>
    </div>
  </div>

  <div class="card step">
    <span class="num">2</span>
    <div>
      <b>复制下面这一行，粘贴运行</b>
      <div class="tabs" id="tabs">
        <button data-os="win">Windows</button>
        <button data-os="mac">macOS</button>
        <button data-os="linux">Linux</button>
      </div>
      <div class="muted" id="how"></div>
      <div class="cmd"><code id="cmd"></code><button id="copy">复制</button></div>
      <div class="muted" id="after"></div>
      <label class="check"><input type="checkbox" id="auto" checked />
        <span>全自动执行：WorkBuddy 不在电脑上弹窗等你点“批准”，人不在电脑前也能做完。<span class="muted">只在你自己的、信任的电脑上勾选。</span></span>
      </label>
    </div>
  </div>

  <div class="card step">
    <span class="num">3</span>
    <div>
      <b>等它连上</b>
      <div id="status"><span class="dot"></span><span id="statusText">等待这台电脑报到……</span></div>
    </div>
  </div>
</main>
<script>
  const ORIGIN = location.origin;
  const HOW = {
    win: ["按 <kbd>Win</kbd>+<kbd>R</kbd> 打开“运行”，粘贴，回车。",
          "弹出“允许此应用更改设备”时点“是”（放行防火墙端口）。会开一个蓝色窗口，看到“连好了”就可以关掉。"],
    mac: ["按 <kbd>⌘</kbd>+<kbd>空格</kbd> 输入“终端”打开，粘贴，回车。",
          "需要 Node.js：没有的话先在终端运行 <code>brew install node</code>。之后如果弹出“bash / node 想访问文件夹”，点允许。"],
    linux: ["打开终端，粘贴，回车。", "需要 Node.js（npm）。"],
  };
  const tabs = document.getElementById("tabs");
  const auto = document.getElementById("auto");
  let os = /Win/i.test(navigator.userAgent) ? "win" : /Mac/i.test(navigator.userAgent) ? "mac" : "linux";

  function command() {
    const q = auto.checked ? "?auto=1" : "";
    if (os === "win") return `powershell -NoExit -ExecutionPolicy Bypass -Command "irm '${ORIGIN}/api/v1/workbuddy/install.ps1${q}' | iex"`;
    return `curl -fsSL '${ORIGIN}/api/v1/workbuddy/install.sh${q}' | bash`;
  }

  function render() {
    for (const b of tabs.children) b.classList.toggle("on", b.dataset.os === os);
    document.getElementById("how").innerHTML = HOW[os][0];
    document.getElementById("after").innerHTML = HOW[os][1];
    document.getElementById("cmd").textContent = command();
  }

  // http:// pages have no navigator.clipboard outside localhost.
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.append(ta);
    ta.select();
    document.execCommand("copy");
    ta.remove();
    return Promise.resolve();
  }

  tabs.addEventListener("click", (e) => {
    if (!e.target.dataset.os) return;
    os = e.target.dataset.os;
    render();
  });
  auto.addEventListener("change", render);
  document.getElementById("copy").addEventListener("click", (e) => {
    copy(command()).then(() => {
      e.target.textContent = "已复制";
      setTimeout(() => (e.target.textContent = "复制"), 1500);
    });
  });
  render();

  // Connected = a PC reported in after this page opened and the robot could reach it.
  const opened = Date.now();
  async function poll() {
    try {
      const res = await fetch("/api/v1/workbuddy", { cache: "no-store" });
      const s = (await res.json()).data || {};
      const fresh = s.peer && s.peer.age_s * 1000 < Date.now() - opened;
      const text = document.getElementById("statusText");
      if (fresh && s.authorized) {
        document.querySelector("#status .dot").classList.add("ok");
        text.textContent = `已连上${s.peer.name ? `「${s.peer.name}」` : ""}。现在可以在手机上让小小白操作这台电脑了，这个页面可以关掉。`;
        return;
      }
      if (fresh) text.textContent = `电脑已报到，但机器人还连不上它：${s.message || ""}`;
    } catch (e) {
      // the robot restarting: keep waiting
    }
    setTimeout(poll, 3000);
  }
  poll();
</script>
</body>
</html>
